# Machine-readable ToS rules for YouTube.
# Plain-language summaries only; the official documents govern (see terms.md).
# Last checked: 2026-09-25. These documents change over time; re-check periodically.
platform: youtube
display_name: YouTube
last_checked: 2026-09-25
actions:
  automated_likes:
    status: restricted
    basis: "YouTube's Terms prohibit fake engagement and anything that artificially increases engagement via automatic systems. Genuine, human-directed likes reflect authentic intent; automated liking is not."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
      - https://developers.google.com/youtube/terms/api-services-terms-of-service
  automated_comments:
    status: restricted
    basis: "Spam and unsolicited promotional content are prohibited. Human-reviewed, genuine comments are authentic; automated mass commenting is spam."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
  automated_follows:
    status: restricted
    basis: "Artificially inflating subscriber counts via automatic systems is fake engagement and is prohibited. Genuine subscriptions are fine; automated subscribe/unsubscribe churn is not."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
  automated_reshares:
    status: restricted
    basis: "Manipulating engagement signals via automatic systems is prohibited. Genuine, human-directed sharing is authentic; automated mass resharing is not."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
  automated_dms:
    status: prohibited
    basis: "YouTube has no direct-messaging feature for creators to message viewers at scale; automated outreach to users via comments or other channels is spam under the Terms and is prohibited."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
  automated_posting:
    status: restricted
    basis: "Accessing the service via automated means (robots, scrapers) is prohibited except for public search engines or with prior written permission. Uploads and publishing belong on the official YouTube API with user OAuth consent; this tool only drafts and records explicit human approval, never publishing by itself."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
      - https://developers.google.com/youtube/terms/api-services-terms-of-service
      - https://developers.google.com/youtube/terms/developer-policies
  automated_data_collection:
    status: restricted
    basis: "YouTube's Terms prohibit accessing the service through automated means (robots, botnets, scrapers) other than public search engines, unless given prior written permission. Low-volume, own-account, read-only monitoring is not affirmatively permitted; the sanctioned path for programmatic access is the YouTube API."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
      - https://developers.google.com/youtube/terms/api-services-terms-of-service
  profile_modification:
    status: restricted
    basis: "Account changes must be human-directed. This tool only proposes profile changes; they require explicit human approval and are applied by the user."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
  automated_reading:
    status: restricted
    basis: "Keep automated reading low-volume and limited to the user's own account. Bulk collection via automated means is prohibited; the API is the sanctioned path."
    sources:
      - https://www.youtube.com/t/terms?gl=DE
