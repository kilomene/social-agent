# Machine-readable ToS rules for Facebook.
# Plain-language summaries only; the official documents govern (see terms.md).
# Last checked: 2026-09-25. These documents change over time; re-check periodically.
platform: facebook
display_name: Facebook
last_checked: 2026-09-25
actions:
  automated_likes:
    status: restricted
    basis: "Facebook's Terms prohibit accessing or collecting data using automated means without prior permission. Genuine, human-directed, low-volume likes are authentic engagement; bulk or scripted liking is not."
    sources:
      - https://www.facebook.com/terms.php
  automated_comments:
    status: restricted
    basis: "Automated means without prior permission are prohibited, and misleading or fraudulent behavior is banned. Human-reviewed, genuine replies are authentic; automated mass commenting is not."
    sources:
      - https://www.facebook.com/terms.php
  automated_follows:
    status: restricted
    basis: "Automated means without prior permission are prohibited. Genuine follows are fine; automated follow/unfollow churn is not."
    sources:
      - https://www.facebook.com/terms.php
  automated_reshares:
    status: restricted
    basis: "Automated means without prior permission are prohibited. Genuine, human-directed shares are authentic; automated mass resharing is not."
    sources:
      - https://www.facebook.com/terms.php
  automated_dms:
    status: restricted
    basis: "Misleading, fraudulent, or unlawful use is prohibited. No unsolicited automated outreach; keep any messaging human-directed and low-volume."
    sources:
      - https://www.facebook.com/terms.php
  automated_posting:
    status: restricted
    basis: "Automated access without prior permission is prohibited. This tool only drafts posts and records explicit human approval; it never publishes by itself."
    sources:
      - https://www.facebook.com/terms.php
  automated_data_collection:
    status: restricted
    basis: "Facebook's Terms (section 3.2.3) prohibit accessing or collecting data from its products using automated means without prior permission, and Meta's developer docs state the Platform APIs are the only allowable means of programmatic access. Low-volume, own-account, read-only monitoring is not affirmatively permitted; this tool never uses Meta's APIs — it is browser-only by the owner's explicit order, with the tos.acknowledged_risk opt-in recording informed acceptance of the risk."
    sources:
      - https://www.facebook.com/terms.php
      - https://developers.facebook.com/docs/development/terms-and-policies/automated-data-collection/?locale=en_US
  profile_modification:
    status: restricted
    basis: "Account changes must be human-directed. This tool only proposes profile changes; they require explicit human approval and are applied by the user."
    sources:
      - https://www.facebook.com/terms.php
  automated_reading:
    status: restricted
    basis: "Keep automated reading low-volume and limited to the user's own account. Bulk collection without permission is prohibited."
    sources:
      - https://www.facebook.com/terms.php
  comment_moderation:
    status: allowed
    basis: "Creators may moderate comments on their own posts (hide, delete, report). This tool only moderates the user's OWN comment sections, proposes hides, and requires explicit approval or a pre-approved policy rule before anything is hidden; it never touches anyone else's content."
    sources:
      - https://www.facebook.com/terms.php
